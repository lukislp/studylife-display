name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  actions: read
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:22
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          cache-suffix: "lint"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    # The `pi` extra (Waveshare driver, spidev, lgpio) is deliberately NOT installed here:
    # it only builds on a Raspberry Pi. `uv sync` without `--all-extras` leaves it out and the
    # driver module imports it lazily, so the whole suite runs on a plain Ubuntu runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:22
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          cache-suffix: "test"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest

  # ---------------------------------------------------------------------
  # Version / release - push to main only, same pattern as the other StudyLife add-ons:
  # the lktec-bot release module drives the version from the commit messages (get-version is
  # its dry run, release creates the tag). There is no image and no
  # cluster deployment: this add-on is installed from a git checkout on the Pi
  # (deploy/install.sh), so the docker/trivy/deploy-bump jobs of the sibling repos are absent.
  # ---------------------------------------------------------------------
  get-version:
    needs: [lint, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: lukislp/lktec-bot/.github/workflows/release.yml@bd3cb5ae7f43aae082765c3d36ec9682ca308e92 # v0.6.0
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@bd3cb5ae7f43aae082765c3d36ec9682ca308e92 # v0.6.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # ---------------------------------------------------------------------
  # SD-card image: built from the tag the release job has just created and attached to that
  # release. Called as a reusable workflow because a release made with GITHUB_TOKEN does not
  # trigger `release` events for other workflows. The image never needs reflashing for
  # updates (the Pi's update.sh keeps working), so a failed image build does not block the
  # release itself; re-run it with the "SD-card image" workflow's tag input.
  # ---------------------------------------------------------------------
  image:
    needs: [get-version, release]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
