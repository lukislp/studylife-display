[project]
name = "studylife-display"
dynamic = ["version"]
description = "E-paper study dashboard for StudyLife on a Raspberry Pi with the Waveshare 7.5 inch HAT V2."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    # zoneinfo needs a tz database; Linux has /usr/share/zoneinfo, Windows does not.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only on the Pi: the Waveshare driver and its GPIO/SPI bindings. Not part of `uv sync`
# (CI runs on Ubuntu), deploy/install.sh installs it with `pip install '.[pi]'`.
pi = [
    "waveshare-epd @ git+https://github.com/waveshareteam/e-Paper.git#subdirectory=RaspberryPi_JetsonNano/python",
    "spidev>=3.6",
    "gpiozero>=2.0",
    "lgpio>=0.2",
]

[project.scripts]
studylife-display = "studylife_display.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The running version comes from the git tag the checkout sits on (semantic-release tags
# `vX.Y.Z`; the installer and update script check those out), so `importlib.metadata`,
# the web footer and /healthz report the release that is actually installed. Between
# tags this is `X.Y.(Z+1).devN+g<sha>`; without any git metadata it falls back to 0.0.0.
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.metadata]
# The `pi` extra is a git direct reference (the Waveshare library is not on PyPI).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_display"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
